# Netlify configuration for Flutter Web App
# SMS Gateway Pro - Web Admin Panel
#
# IMPORTANT: Build is handled by GitHub Actions (.github/workflows/deploy-netlify.yml)
# Netlify's automatic builds are disabled - GitHub Actions deploys directly via API

[build]
  command = "exit 0"
  publish = "build/web"

# API Documentation route
[[redirects]]
  from = "/api-docs"
  to = "/api-docs.html"
  status = 200

[[redirects]]
  from = "/openapi.yaml"
  to = "/openapi.yaml"
  status = 200

# SPA routing - redirect all other requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
